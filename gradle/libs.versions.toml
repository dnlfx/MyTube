# Same commit the NewPipe app ships; tagged releases fall behind YouTube changes quickly.
newpipeExtractor = "e8f89145a830b4d6cae32412007f24ea8b36c73a"
desugar = "2.1.5"
splash = "1.2.0"
profileinstaller = "1.4.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
