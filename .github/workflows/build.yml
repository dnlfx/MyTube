name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add a MYTUBE_KEYSTORE_BASE64 secret (plus the passwords) so every
      # build is signed with the same key and installs over the previous one.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYTUBE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "MYTUBE_KEYSTORE_PATH=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MYTUBE_STORE_PASSWORD: ${{ secrets.MYTUBE_STORE_PASSWORD }}
          MYTUBE_KEY_PASSWORD: ${{ secrets.MYTUBE_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mytube-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Builds from main replace the one and only release, so the Releases page always
      # holds just the newest APK.
      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk MyTube.apk
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$tag" --cleanup-tag --yes
          done
          git push origin --delete latest 2>/dev/null || true
          gh release create latest MyTube.apk \
            --target "$GITHUB_SHA" \
            --title "MyTube" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Download MyTube.apk below and open it on your phone." \
            --latest
