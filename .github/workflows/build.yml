name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add a MYTUBE_KEYSTORE_BASE64 secret (plus the passwords) so every
      # build is signed with the same key and installs over the previous one.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYTUBE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "MYTUBE_KEYSTORE_PATH=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MYTUBE_STORE_PASSWORD: ${{ secrets.MYTUBE_STORE_PASSWORD }}
          MYTUBE_KEY_PASSWORD: ${{ secrets.MYTUBE_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mytube-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
